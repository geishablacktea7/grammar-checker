name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Copy the Harper grammar engine into the site so it is served from
      # github.io itself (no dependency on a third-party CDN at runtime).
      - name: Bundle Harper engine
        run: |
          HARPER_VERSION=$(grep -oP 'HARPER_VERSION = "\K[^"]+' site/app.js)
          echo "Harper version: $HARPER_VERSION"
          mkdir -p /tmp/harper && cd /tmp/harper
          npm pack "harper.js@$HARPER_VERSION"
          tar -xzf harper.js-*.tgz
          mkdir -p "$GITHUB_WORKSPACE/site/vendor/harper"
          cp -r package/dist/. "$GITHUB_WORKSPACE/site/vendor/harper/"
          cp package/LICENSE* "$GITHUB_WORKSPACE/site/vendor/harper/" 2>/dev/null || true
          # The site loads binary.js + harper_wasm_bg.wasm; drop the unused variants.
          cd "$GITHUB_WORKSPACE/site/vendor/harper"
          rm -f binaryInlined.js slimBinaryInlined.js slimBinary.js harper_wasm_slim_bg.wasm *.d.ts
          ls -la "$GITHUB_WORKSPACE/site/vendor/harper"

      # Open the site in Chrome with the real engine; stop if nothing gets flagged.
      - name: Smoke test
        run: |
          mkdir -p /tmp/smoke && cd /tmp/smoke
          npm init -y >/dev/null
          npm install --no-audit --no-fund puppeteer-core@23.11.1
          cp "$GITHUB_WORKSPACE/tests/smoke.mjs" .
          CHROME_PATH=$(which google-chrome || which chromium) node smoke.mjs "$GITHUB_WORKSPACE/site"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
